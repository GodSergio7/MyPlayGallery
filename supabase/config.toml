project_id = "myplaygallery"

# SPEC-04: el gateway de Supabase exige JWT (anon key) para invocar la funcion,
# de modo que no queda completamente expuesta. No se implementa autenticacion
# de usuario en esta fase; se abordara en SPEC-05/Auth.
[functions.igdb-proxy]
verify_jwt = true

[functions.steam-connect]
verify_jwt = true

[functions.steam-library]
verify_jwt = true
