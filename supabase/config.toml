project_id = "myplaygallery"

# El gateway exige un JWT (vale la clave publica) y, ademas, la propia funcion comprueba
# que sea el de un usuario con sesion y limita las peticiones por usuario (T-01).
[functions.igdb-proxy]
verify_jwt = true

[functions.steam-connect]
verify_jwt = true

[functions.steam-library]
verify_jwt = true

# Sin JWT de usuario: es la funcion que crea la sesion (verifica la cuenta con Steam).
[functions.steam-login]
verify_jwt = false
